<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Página CNPJ | Crie sua página institucional automaticamente</title>
    <meta name="description" content="Envie o Cartão CNPJ em PDF e gere sua página institucional completa com Tailwind CSS, WhatsApp e dados cadastrais da Receita Federal." />
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace']
            },
            colors: {
              brandDark: '#0a0a0a',
              brandCard: '#111111',
              brandBorder: '#1f1f1f',
              brandYellow: '#facc15',
              brandGreen: '#22c55e',
              brandText: '#f4f4f5',
              brandMuted: '#a1a1aa'
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#0a0a0a] text-[#f4f4f5] font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
